version: '3.8'

services:
  backend:
    build:
      context: ./medical_ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./medical_ai:/app
      - /app/.venv # Prevent local virtualenv from interfering with the container

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Define the backend URL that the frontend will use (accessed via browser)
        - VITE_API_BASE=http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
