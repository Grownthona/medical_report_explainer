version: '3.8'

services:
  backend:
    build:
      context: ./medical_ai
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173}
    volumes:
      - ./medical_ai:/app
      - /app/.venv # Prevent local virtualenv from interfering with the container
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
