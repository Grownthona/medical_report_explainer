services:
  # FastAPI Backend
  - type: web
    name: medical-ai-backend
    runtime: docker
    dockerContext: ./medical_ai
    dockerfilePath: Dockerfile
    plan: starter
    envVars:
      - key: CORS_ORIGINS
        value: "https://medical-report-explainer.onrender.com"
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: OLLAMA_ENABLED
        value: "false"

  # React Frontend (Static Site)
  - type: web
    name: medical-report-explainer
    runtime: static
    staticPublishPath: ./frontend/dist
    buildCommand: cd frontend && npm install && npm run build
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: medical-ai-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html